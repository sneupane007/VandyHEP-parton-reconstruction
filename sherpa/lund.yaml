# pp -> gamma + jet at 14 TeV, q g -> q gamma only (as Pythia's PromptPhoton:qg2qgamma in main214.cc),
# CSS shower, MPI on; the two samples differ only in FRAGMENTATION (Ahadic cluster vs Pythia8 Lund string).
BEAMS: 2212
BEAM_ENERGIES: 7000
MI_HANDLER: Amisic
FRAGMENTATION: Pythia8
SHERPA_LDADD: [SherpaPythia]   # Lund string via Pythia 8.315
EVENT_GENERATION_MODE: Unweighted
ME_GENERATORS: [Comix]
PROCESSES:   # one ordering; Sherpa includes the swapped beams itself
- 21 93 -> 22 93:
    Order: {QCD: 1, EW: 1}
    Integration_Error: 0.02
SELECTORS:
- [PT, 22, 700.0, 7000.0]
